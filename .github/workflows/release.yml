# 自动打包：推送形如 v0.9.5 的 tag 时，在 Windows 上打包、生成 SHA256、创建（或补充）Release。
# 手动运行（Actions 页面 → Run workflow）：tag 留空只打包、保存为构建产物，不发布；
# 填一个已有的 tag（例如 v0.9.5）则打包它并上传到对应的 Release（补传文件、重新发布时用）。
# Builds on tag push (v*): packages with PyInstaller, writes a SHA256 file and publishes a release.
# A manual run with an empty tag only builds; with an existing tag it builds that tag and uploads to its release.
name: Build and release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "已有的 tag（例如 v0.9.5）：打包它并上传到对应的 Release。留空则只打包、不发布"
        required: false
        default: ""
      update_notes:
        description: "同时用 release-notes/<tag>.md 覆盖这个 Release 的说明"
        type: boolean
        default: false

permissions:
  contents: write          # 创建 Release、上传文件需要

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # 要发布到哪个 tag：打 tag 触发时就是这个 tag；手动运行时取填写的 tag；都没有就不发布
      RELEASE_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name || '') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Read version from gui.py
        id: ver
        shell: pwsh
        run: |
          $line = Select-String -Path gui.py -Pattern '^APP_VERSION = "(.+)"' | Select-Object -First 1
          if (-not $line) { throw "Cannot find APP_VERSION in gui.py" }
          $version = $line.Matches[0].Groups[1].Value
          "version=$version" >> $env:GITHUB_OUTPUT
          # 打 tag 发布时，tag 必须和程序里的版本号一致，避免发出名不副实的包
          if ($env:RELEASE_TAG -and $env:RELEASE_TAG -ne "v$version") {
            throw "Tag $env:RELEASE_TAG does not match APP_VERSION $version in gui.py"
          }

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Import check
        run: |
          python -m compileall -q engine.py gui.py preset_updater.py domain_presets.py tools
          python -c "import engine, preset_updater, domain_presets; print('imports ok')"

      # 在真实的 Windows + PySide6 上把窗口建出来、喂几行假数据；失败就不打包
      - name: GUI smoke test
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          # 以“输出了 SMOKE_OK”为准：Qt 退出时偶尔让进程返回非 0，但检查本身已经全部通过
          python tools/ci_smoke.py 2>&1 | Tee-Object -FilePath smoke.log
          Write-Host "smoke test process exit code: $LASTEXITCODE"
          if (-not (Select-String -Path smoke.log -Pattern '^SMOKE_OK' -Quiet)) {
            throw "GUI smoke test did not finish (no SMOKE_OK line above)"
          }
          $global:LASTEXITCODE = 0

      # 参数和 build.bat 保持一致
      - name: Build
        run: >
          python -m PyInstaller --noconfirm --clean --windowed --uac-admin --icon splitdirect.ico
          --name SplitDirect --collect-all pydivert --hidden-import psutil._psutil_windows gui.py

      - name: Package and checksum
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $zip = "SplitDirect-$env:VERSION-win64.zip"
          if (-not (Test-Path dist\SplitDirect\SplitDirect.exe)) { throw "dist\SplitDirect\SplitDirect.exe was not built" }
          Compress-Archive -Path dist\SplitDirect -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Out-File -Encoding ascii "$zip.sha256"
          "ZIP=$zip" >> $env:GITHUB_ENV
          "HASH=$hash" >> $env:GITHUB_ENV
          Write-Host "$hash  $zip"

      - uses: actions/upload-artifact@v4
        with:
          name: SplitDirect-win64
          path: |
            ${{ env.ZIP }}
            ${{ env.ZIP }}.sha256

      - name: Publish release
        if: env.RELEASE_TAG != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
          UPDATE_NOTES: ${{ inputs.update_notes }}
        run: |
          $notes = "release-notes/$env:RELEASE_TAG.md"
          if (Test-Path $notes) {
            $body = Get-Content $notes -Raw -Encoding utf8
          } else {
            $body = "Windows 64 位：解压后运行 SplitDirect.exe（需要管理员权限）。`nWindows x64: extract the zip and run SplitDirect.exe (administrator rights required)."
          }
          $fence = '```'
          $body += "`n`n**SHA256**`n$fence`n$env:HASH  $env:ZIP`n$fence`n"
          Set-Content -Path release-body.md -Value $body -Encoding utf8

          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            # 已经在网页上建好了 Release：补上传文件；说明只有勾选 update_notes 时才覆盖
            gh release upload $env:RELEASE_TAG $env:ZIP "$env:ZIP.sha256" --clobber
            if ($LASTEXITCODE -ne 0) { throw "gh release upload failed" }
            if ($env:UPDATE_NOTES -eq 'true') {
              gh release edit $env:RELEASE_TAG --notes-file release-body.md
              if ($LASTEXITCODE -ne 0) { throw "gh release edit failed" }
            }
          } else {
            gh release create $env:RELEASE_TAG $env:ZIP "$env:ZIP.sha256" --title "SplitDirect $env:VERSION" --notes-file release-body.md --verify-tag
            if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
          }
